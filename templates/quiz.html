<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Star Trek Quiz</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: #101522;
            color: white;
            text-align: center;
        }

        .quiz-box {
            background-color: #1e2940;
            padding: 30px;
            border-radius: 12px;
        }

        button {
            width: 80%;
            padding: 12px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="quiz-box">
        <h1>🖖 Star Trek Quiz</h1>
        <p>
            Question {{ question_number }} of 10
            <br>
            Score: {{ score }} / 20
        </p>

        <h2>{{ question["text"] }}</h2>

        <p>
            This question is worth {{ question["points"] }} points.
        </p> 

        <form method="POST" action="/answer">
            {% for answer in answers %}
                <button
                    type="submit"
                    name="answer"
                    value="{{ answer }}"
                >
                    {{ answer }}
                </button>
            {% endfor %}
        </form>
    </div>
</body>
</html>
